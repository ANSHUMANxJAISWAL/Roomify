version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: roomify-postgres
    environment:
      POSTGRES_DB: roomify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/data.sql
    networks:
      - roomify-network

  backend:
    build: .
    container_name: roomify-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DB_URL: jdbc:postgresql://postgres:5432/roomify
      JWT_SECRET: roomify-super-secret-jwt-key-2024
    depends_on:
      - postgres
    networks:
      - roomify-network

  frontend:
    build: ./frontend
    container_name: roomify-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - roomify-network

volumes:
  postgres_data:

networks:
  roomify-network:
    driver: bridge
