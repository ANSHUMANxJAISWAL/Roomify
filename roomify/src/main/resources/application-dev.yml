spring:
  datasource:
    url: jdbc:h2:mem:roomify_dev;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false
  security:
    user:
      name: devuser
      password: ${DEV_DB_PASSWORD:devpassword}
      roles: USER,ADMIN

logging:
  level:
    root: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.data: DEBUG
    org.hibernate: DEBUG
    org.springframework.orm: DEBUG
    com.roomify: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.jdbc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080
  servlet:
    context-path: /api
