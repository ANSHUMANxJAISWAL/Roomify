# ========================================
# Application Configuration
# ========================================
spring.application.name=roomify-backend
spring.profiles.active=dev

# ========================================
# Server Configuration
# ========================================
server.port=8080
server.servlet.context-path=/api

# ========================================
# MySQL Database Configuration
# ========================================
spring.datasource.url=jdbc:mysql://localhost:3306/roomify_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ========================================
# JPA/Hibernate Configuration
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# ========================================
# Logging Configuration
# ========================================
logging.level.root=DEBUG
logging.level.com.roomify=DEBUG
logging.level.org.springframework.boot.actuator=DEBUG
logging.level.org.springframework.web=DEBUG

# ========================================
# Security Configuration
# ========================================
spring.security.user.name=admin
spring.security.user.password=admin123

# JWT Configuration
spring.security.jwt.secret=roomify-super-secret-jwt-key-change-this-in-production-minimum-512-bits-required-for-hs512-algorithm
spring.security.jwt.access-token-validity=3600000
spring.security.jwt.refresh-token-validity=86400000

# ========================================
# Actuator Configuration
# ========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ========================================
# Swagger/OpenAPI Configuration
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
