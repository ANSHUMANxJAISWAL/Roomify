# ========================================
# Application Configuration
# ========================================
spring.application.name=roomify-backend
spring.profiles.active=dev

# ========================================
# Server Configuration
# ========================================
server.port=8080
server.servlet.context-path=/api

# ========================================
# H2 Database Configuration (In-Memory)
# ========================================
spring.datasource.url=jdbc:h2:mem:roomify_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Access at http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ========================================
# JPA/Hibernate Configuration
# ========================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ========================================
# Logging Configuration
# ========================================
logging.level.root=INFO
logging.level.com.roomify=DEBUG
logging.level.org.springframework.boot.actuator=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE


# ========================================
# Actuator Configuration
# ========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ========================================
# Swagger/OpenAPI Configuration
# ========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Disable Flyway to avoid circular dependency issues
spring.flyway.enabled=false
